[package]
name = "fairliny-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Unka-Malloc/Fairlead"
readme = "README.md"
description = "The unified model gateway: gathers model-provider access (a4mp) and credential leases (Credential-Lease) into one outward model-service face; a forwarding-only core with Metera usage metering composed in."
keywords = ["ai", "llm", "gateway", "model-provider", "metering"]
categories = ["api-bindings", "asynchronous", "web-programming"]

[lib]
name = "fairliny_gateway"
path = "src/lib.rs"

[[bin]]
name = "fairliny"
path = "src/bin/fairliny.rs"

[workspace]
resolver = "3"

[dependencies]
a4mp = "0.4.0"
credential-lease = "0.3.0"
agent-statistics = "0.3.0"
token-usage-detector = "0.2.2"
collection-store = "0.1.1"
anyhow = "1"
async-trait = "0.1"
futures-core = "0.3"
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "io-util", "io-std"] }
url = "2"
uuid = "1"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
