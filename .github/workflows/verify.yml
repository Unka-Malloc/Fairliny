name: Verify

on:
  push:
    branches: [main]
    tags: ["*-v[0-9]*"]
  pull_request:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Cargo path dependencies land side by side: a4mp, credential-lease and
      # the Metera crates — whose acop workspace deps resolve through one
      # more sibling.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: Fairliny-Gateway
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: Unka-Malloc/Adapters-For-Model-Providers
          path: Adapters-For-Model-Providers
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: Unka-Malloc/Credential-Lease
          path: Credential-Lease
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: Unka-Malloc/Metera
          path: Metera
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: Unka-Malloc/Agent-Context-Operators
          path: ACOP
          persist-credentials: false
      - name: Rust toolchain
        run: rustup component add rustfmt clippy
      - name: Verify
        run: ./scripts/verify.sh
        working-directory: Fairliny-Gateway
      - name: Package the tagged crate
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: cargo package --locked -p "${TAG%-v*}"
        working-directory: Fairliny-Gateway
